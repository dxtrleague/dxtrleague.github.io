
<!DOCTYPE html>
<html lang="id">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>DXTR League - Coming Soon</title>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;400&display=swap" rel="stylesheet">
	<style>
		:root {
			--main-pink: #ff5fa2;
			--main-purple: #a259ff;
			--main-dark: #232526;
		}
		body {
			background: linear-gradient(120deg, var(--main-pink) 0% 60%, var(--main-purple) 60% 90%, var(--main-dark) 90% 100%);
			color: var(--main-dark);
			font-family: 'Montserrat', Arial, sans-serif;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			margin: 0;
		}
		.card {
			background: #fff;
			padding: 3rem 2.5rem 2.5rem 2.5rem;
			border-radius: 1.5rem;
			box-shadow: 0 8px 32px 0 rgba(162, 89, 255, 0.10);
			text-align: center;
			max-width: 400px;
			width: 90%;
			position: relative;
		}
		h1 {
			font-size: 2.2rem;
			font-weight: 700;
			margin-bottom: 0.5rem;
			color: var(--main-pink);
		}
		.subtitle {
			font-size: 1.1rem;
			color: var(--main-purple);
			margin-bottom: 2rem;
		}
		.progress {
			width: 100%;
			background: #f8e6ef;
			border-radius: 1rem;
			overflow: hidden;
			margin-bottom: 1.5rem;
			height: 12px;
		}
		.progress-bar {
			width: 60%;
			height: 100%;
			background: linear-gradient(90deg, var(--main-pink) 0%, var(--main-purple) 100%);
			transition: width 1s;
		}
		.info {
			color: var(--main-dark);
			font-size: 1rem;
			margin-bottom: 1.5rem;
		}
		footer {
			margin-top: 2.5rem;
			color: #fff;
			font-size: 0.95rem;
			text-align: center;
		}
	</style>
</head>
<body>
	<div class="card">
		<h1>Coming Soon</h1>
		<div class="subtitle">We are working hard to launch the new DXTR League website.</div>
		<div class="progress"><div class="progress-bar"></div></div>
		<div class="info">This website is currently under construction.<br>Please check back again soon for updates.</div>
	</div>
	<footer>&copy; 2025 DXTR League. All rights reserved.</footer>
</body>
</html>
